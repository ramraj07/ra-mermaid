name: Deploy playground to Pages

# Builds mermaid and the ELK layout from this fork and publishes them, with the
# editor in `playground/`, to GitHub Pages. The upstream `publish-docs.yml` only
# deploys from `master`, which this fork does not use, so the two never compete
# for the Pages site.
on:
  push:
    branches:
      - develop
      - feature/flowchart-stacked-subgraphs
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-playground:
    if: github.repository == 'ramraj07/ra-mermaid'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'

      - name: Install Packages
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm build:esbuild

      # Only the minified ESM bundles the page loads, without source maps.
      - name: Assemble site
        run: |
          mkdir -p site
          cp playground/index.html site/
          for pkg in mermaid mermaid-layout-elk; do
            cp "packages/$pkg/dist/$pkg.esm.min.mjs" site/
            mkdir -p "site/chunks/$pkg.esm.min"
            cp packages/$pkg/dist/chunks/$pkg.esm.min/*.mjs "site/chunks/$pkg.esm.min/"
          done
          touch site/.nojekyll
          du -sh site

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy-playground:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-playground
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
